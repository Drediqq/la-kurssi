---
# Ei kahta deployta yhtä aikaa samaan palvelimeen
concurrency:
  cancel-in-progress: false
  group: deploy-${{ github.ref }}
jobs:
  deploy:
    env:
      HOST: ${{ secrets.CPOUTA_HOST }}
      SSH_USER: ${{ secrets.CPOUTA_USER }}
    environment: production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Deploy cPoutaan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          KNOWN_HOSTS: ${{ secrets.CPOUTA_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.CPOUTA_SSH_KEY }}
        name: SSH-avain ja known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh 
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key 
          chmod 600 ~/.ssh/deploy_key 
          if [ -n "$KNOWN_HOSTS" ]; then 
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts 
          else 
            echo "::warning::CPOUTA_KNOWN_HOSTS puuttuu, käytetään ssh-keyscania" 
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 
          fi 
          cat >> ~/.ssh/config <<EOF 
          Host cpouta 
            HostName $HOST 
            User $SSH_USER 
            IdentityFile ~/.ssh/deploy_key 
            IdentitiesOnly yes 
          EOF
      - name: Kopioi koodi palvelimelle (rsync)
        run: |
          rsync -az --delete --chmod=D755,F644 \
           --exclude '.git' --exclude '.github' --exclude '__pycache__' \
           --exclude '.pytest_cache' --exclude '.ruff_cache' --exclude 'REVISION' \
           ./ cpouta:/opt/chatapp/app/
      - name: Aja deploy-skripti
        run: ssh cpouta "bash /opt/chatapp/app/scripts/deploy.sh ${{ github.sha }}"
      - name: Julkinen savutesti
        run: |
          # Koko ketju: Nginx -> snippet /week5/ -> soketti -> Gunicorn -> Flask
          curl -fsS --retry 5 --retry-delay 3 "http://$HOST/week5/health" | grep -qx "${{ github.sha }}"
          curl -fsS "http://$HOST/week5/" | grep -q 'id="chat-form"'
          # Staattiset tiedostot alipolusta (Nginx alias)
          curl -fsS -o /dev/null "http://$HOST/week5/static/app.js"
          echo "Sovellus vastaa osoitteessa http://$HOST/week5/"
      - name: cPouta koneen muisti ja cpu
        run: |
          ssh cpouta "free -h && lscpu"

      - name: Github koneen muisti ja cpu
        run: |
          free -h
          lscpu
  test:
    name: Lint ja testit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: chatapp/requirements*.txt
          python-version: '3.12'
      - name: Asenna riippuvuudet
        run: pip install -r chatapp/requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest
        run: pytest
      - name: Shell-skriptien syntaksitarkistus
        run: bash -n scripts/*.sh
name: CI/CD
'on':
  pull_request: null
  push:
    branches: [main]
  workflow_dispatch: null
