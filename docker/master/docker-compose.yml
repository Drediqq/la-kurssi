services:
  web:
    build: .
    container_name: flask_container
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - SITE_MODE=${SITE_MODE}
    volumes:
      - /var/www/html/lakurssi/week2:/app
    networks:
      - shared-network
    depends_on:
      - db

  db:
    image: mariadb:latest
    container_name: mariadb_prime
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --bind-address=0.0.0.0
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - shared-network

volumes:
  mariadb_data:

networks:
  shared-network:
    external: true