services:
  web:
    build: .
    container_name: flask_container
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
    volumes:
      - .:/app
    networks:
      - shared-network

networks:
  shared-network:
    external: true