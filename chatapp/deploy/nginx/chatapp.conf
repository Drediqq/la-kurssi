# Nginx-SNIPPET: chat-sovellus alipolkuun /week5/
#
# Tämä EI ole oma sivusto (server-lohko), vaan pätkä, joka liitetään palvelimen
# olemassa olevaan sivustoon. Aiempien viikkojen sivut (/viikko2/ ym.) jatkavat toimintaansa.
#
# deploy.sh kopioi tämän polkuun /etc/nginx/snippets/chatapp.conf.
# Olemassa olevan sivuston server { } -lohkoon lisätään KERRAN käsin rivi:
#     include snippets/chatapp.conf;
#
# ^~ = jos polku alkaa /week5/, Nginx ei enää kokeile sivuston regex-locationeita
#      (esim. location ~ \.php$ tai location ~* \.(css|js)$), jotka muuten voisivat
#      siepata pyynnön ja ohjata sen väärään paikkaan.

location = /week5 {
    return 301 /week5/;
}

# Staattiset tiedostot suoraan Nginxiltä
location ^~ /week5/static/ {
    alias /opt/chatapp/app/static/;
    expires 1h;
    add_header Cache-Control "public";
}

location ^~ /week5/ {
    # Kauttaviiva soketin perässä (:/) poistaa etuliitteen: /week5/api/chat -> /api/chat.
    # Flask saa etuliitteen X-Forwarded-Prefix-otsakkeesta ja käyttää sitä linkeissä.
    proxy_pass http://unix:/run/chatapp/gunicorn.sock:/;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /week5;

    client_max_body_size 64k;

    # LLM-vastaus striimataan token kerrallaan -> ei puskurointia
    proxy_buffering off;
    proxy_cache off;

    # CPU:lla pyörivä malli voi olla hidas
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}