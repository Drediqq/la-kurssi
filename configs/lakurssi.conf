server {
        listen 80;
        listen [::]:80;

        root /var/www/html/lakurssi;
        index index.html index.htm;
        server_name _;

        # strip trailing .html
        location ~ ^/(?<path>.*)\.html$ {
                return 301 /$path;
        }
        location /week1 {
                try_files $uri /week1/week1.html =404;
        }

        # reverse proxy week2
        location /week2 {
                proxy_pass http://127.0.0.1:5000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        # week3
        location /week3 {
                try_files $uri /week3/week3.html =404;
        }

        # stats with caching disabled
        location /week3/stats/ {
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
                expires off;
        }
        
        location /week4 {
                proxy_pass http://127.0.0.1:5000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
        # stats for week4
        location /var/www/html/lakurssi/week2/templates/stats/ {
                alias /var/www/html/lakurssi/week2/templates/stats/;
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        }

        # week5
        include snippets/chatapp.conf;

        # handler for everything else
        location / {
                try_files $uri $uri/ $uri.html =404;
        }
}